<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tools Directory</title>
    <meta
      name="description"
      content="A clean directory page for useful tools and resources."
    />
    <link rel="icon" type="image/png" href="assets/icons/tools-home-favicon.png" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <aside class="profile-widget" id="profileWidget" aria-label="關於工具集作者">
      <button
        class="profile-toggle"
        id="profileToggle"
        type="button"
        aria-label="開啟個人介紹"
        aria-expanded="false"
        aria-controls="profileCard"
      >
        <span class="profile-toggle__icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>關於我</span>
      </button>
      <div class="profile-card" id="profileCard">
        <div class="profile-card__heading">
          <img src="assets/icons/tools-home-favicon.png" alt="" width="48" height="48" />
          <div>
            <p class="profile-card__label">工具集作者</p>
            <h2>XthyWork</h2>
          </div>
        </div>
        <p class="profile-card__intro">專注於透過 AI 協作開發軟體服務與 Web 應用。</p>
        <dl class="profile-card__facts">
          <div>
            <dt>信箱</dt>
            <dd><a href="mailto:xthywork@gmail.com">xthywork@gmail.com</a></dd>
          </div>
        </dl>
        <a class="profile-card__link" href="https://xthy.work/" target="_blank" rel="noreferrer noopener">
          個人網站 <span aria-hidden="true">↗</span>
        </a>
        <a class="profile-card__link" href="https://github.com/xthywork" target="_blank" rel="noreferrer noopener">
          GitHub <span aria-hidden="true">↗</span>
        </a>
      </div>
    </aside>

    <div class="page-shell">
      <header class="hero">
        <div class="hero__brand">
          <img src="assets/icons/tools-home-favicon.png" alt="Xthy Work logo" class="hero__badge-logo" />
          <h1 class="hero__title">Xthy Work 工具集</h1>
        </div>
      </header>

      <main class="directory-layout">
        <section class="controls-panel">
          <div class="search-box">
            <label class="search-box__label" for="searchInput">搜尋</label>
            <input
              id="searchInput"
              class="search-box__input"
              type="search"
              placeholder="輸入工具名稱、介紹或標籤..."
              autocomplete="off"
            />
          </div>

          <div class="tags-panel">
            <div class="section-head">
              <h2>標籤篩選</h2>
              <button id="clearFiltersBtn" class="ghost-button" type="button">清除篩選</button>
            </div>
            <div id="tagList" class="tag-list" aria-label="Tool tag filters"></div>
          </div>
        </section>

        <section class="results-panel">
          <div class="section-head section-head--results">
            <h2>工具列表</h2>
            <p id="resultsCount" class="results-count">載入中...</p>
          </div>

          <div id="toolsGrid" class="tools-grid"></div>
          <div id="emptyState" class="empty-state" hidden>
            <h3>找不到符合條件的工具</h3>
            <p>可以試試別的關鍵字，或清除目前的標籤篩選。</p>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/js/profile.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
